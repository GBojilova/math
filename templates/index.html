<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математическо помагало</title>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 50%, #fef9c3 100%);
            color: #1e293b;
            box-sizing: border-box;
        }
        .wrapper {
            max-width: 680px;
            margin: 30px auto;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .top-bar a {
            color: #0284c7;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95em;
        }
        .top-bar a:hover { text-decoration: underline; }
        .score-badge {
            background: #dcfce7;
            color: #166534;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95em;
            display: none;
        }
        .card {
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        h2 {
            margin-top: 0;
            color: #0f172a;
            font-size: 1.5em;
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #334155;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 1.05em;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            box-sizing: border-box;
            background: #f8fafc;
            transition: border-color 0.2s;
        }
        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: #0284c7;
            background: #ffffff;
        }
        .topic-tag {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
        }
        .question {
            font-size: 1.35em;
            margin: 25px 0;
            color: #0f172a;
            line-height: 1.6;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid #0284c7;
        }
        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }
        button {
            padding: 14px 24px;
            font-size: 1.05em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-main { background: #0284c7; color: white; width: 100%; margin-top: 22px; }
        .btn-main:hover { background: #0369a1; }
        .btn-check { background: #16a34a; color: white; flex: 1; }
        .btn-check:hover { background: #15803d; }
        .btn-next { background: #0284c7; color: white; display: none; flex: 1; }
        .btn-back {
            background: none;
            border: none;
            color: #64748b;
            padding: 5px 10px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .btn-back:hover { color: #0f172a; }
        .feedback {
            margin-top: 22px;
            padding: 18px;
            border-radius: 12px;
            display: none;
            line-height: 1.6;
            font-size: 1.05em;
        }
        .correct {
            background-color: #dcfce7;
            color: #14532d;
            border: 2px solid #86efac;
        }
        .wrong {
            background-color: #fee2e2;
            color: #7f1d1d;
            border: 2px solid #fca5a5;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="top-bar">
        <a href="/admin">⚙️ Админ панел</a>
        <span id="score" class="score-badge">Решени вярно: 0</span>
    </div>

    <div class="card" id="app-container">
        Зареждане...
    </div>
</div>

<script>
    let categoriesData = {};
    let tasks = [];
    let currentIndex = 0;
    let score = 0;
    let selectedGrade = "";
    let selectedTopic = "";

    async function loadCategories() {
        const res = await fetch('/api/categories');
        categoriesData = await res.json();
        showSelectionScreen();
    }

    function showSelectionScreen() {
        const container = document.getElementById('app-container');
        document.getElementById('score').style.display = 'none';

        let gradeOptions = '<option value="">-- Изберете клас --</option>';
        for (let grade in categoriesData) {
            gradeOptions += `<option value="${grade}">${grade}</option>`;
        }

        container.innerHTML = `
            <h2>Изберете тема за упражнение</h2>
            <label>Клас:</label>
            <select id="grade-select" onchange="updateTopics()">${gradeOptions}</select>
            
            <label>Раздел / Тема:</label>
            <select id="topic-select" disabled><option value="">-- Първо изберете клас --</option></select>
            
            <button class="btn-main" onclick="startPracticing()">Започни упражнението</button>
        `;
    }

    function updateTopics() {
        const grade = document.getElementById('grade-select').value;
        const topicSelect = document.getElementById('topic-select');
        
        if (!grade) {
            topicSelect.innerHTML = '<option value="">-- Първо изберете клас --</option>';
            topicSelect.disabled = true;
            return;
        }

        let topics = categoriesData[grade] || [];
        let options = '<option value="">-- Изберете тема --</option>';
        topics.forEach(t => {
            options += `<option value="${t}">${t}</option>`;
        });

        topicSelect.innerHTML = options;
        topicSelect.disabled = false;
    }

    async function startPracticing() {
        selectedGrade = document.getElementById('grade-select').value;
        selectedTopic = document.getElementById('topic-select').value;

        if (!selectedGrade || !selectedTopic) {
            alert('Моля, изберете клас и тема!');
            return;
        }

        const res = await fetch(`/api/tasks?grade=${encodeURIComponent(selectedGrade)}&topic=${encodeURIComponent(selectedTopic)}`);
        tasks = await res.json();

        if (tasks.length === 0) {
            alert('Няма намерени задачи за тази категория.');
            return;
        }

        currentIndex = 0;
        score = 0;
        const scoreEl = document.getElementById('score');
        scoreEl.style.display = 'inline-block';
        scoreEl.innerText = `Решени вярно: 0 / ${tasks.length}`;
        showTask();
    }

    function renderMath() {
        if (window.MathJax) {
            MathJax.typesetPromise();
        }
    }

    function showTask() {
        if (currentIndex >= tasks.length) {
            document.getElementById('app-container').innerHTML = `
                <div style="text-align: center; padding: 20px 0;">
                    <h2 style="font-size: 1.8em; color: #16a34a;">🎉 Поздравления!</h2>
                    <p style="font-size: 1.15em;">Завършихте упражнението по <strong>${selectedTopic} (${selectedGrade})</strong>.</p>
                    <p style="font-size: 1.3em; margin: 20px 0;"><strong>Вашият резултат: ${score} от ${tasks.length}</strong></p>
                    <button class="btn-main" onclick="loadCategories()">Изберете друга тема</button>
                </div>
            `;
            document.getElementById('score').style.display = 'none';
            return;
        }

        const task = tasks[currentIndex];
        const container = document.getElementById('app-container');

        container.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span class="topic-tag">${task.grade} &bull; ${task.topic}</span>
                <button class="btn-back" onclick="loadCategories()">&larr; Смени темата</button>
            </div>
            <div style="margin-top: 10px; font-size: 0.9em; color: #64748b;">
                Задача ${currentIndex + 1} от ${tasks.length}
            </div>
            <div class="question">${task.question}</div>
            
            <input type="text" id="user-answer" placeholder="Въведете вашия отговор тук..." autocomplete="off">
            
            <div class="buttons">
                <button class="btn-check" id="check-btn" onclick="checkAnswer()">Провери</button>
                <button class="btn-next" id="next-btn" onclick="nextTask()">Следваща задача &rarr;</button>
            </div>

            <div class="feedback" id="feedback-box"></div>
        `;

        const inputEl = document.getElementById('user-answer');
        inputEl.focus();
        inputEl.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !this.disabled) {
                checkAnswer();
            }
        });

        renderMath();
    }

    async function checkAnswer() {
        const answerInput = document.getElementById('user-answer').value;
        if (!answerInput.trim()) return;

        const task = tasks[currentIndex];
        const response = await fetch('/api/check', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ task_id: task.id, answer: answerInput })
        });
        
        const result = await response.json();
        const feedbackBox = document.getElementById('feedback-box');
        
        feedbackBox.style.display = 'block';
        document.getElementById('user-answer').disabled = true;
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'inline-block';

        if (result.is_correct) {
            score++;
            document.getElementById('score').innerText = `Решени вярно: ${score} / ${tasks.length}`;
            feedbackBox.className = 'feedback correct';
            feedbackBox.innerHTML = `<strong style="font-size: 1.2em;">Браво!</strong><br><br><em>Обяснение:</em> ${result.explanation}`;
        } else {
            feedbackBox.className = 'feedback wrong';
            feedbackBox.innerHTML = `<strong style="font-size: 1.2em;">Опитай пак!</strong> Верният отговор е: <strong>${result.correct_answer}</strong><br><br><em>Как се решава:</em> ${result.explanation}`;
        }

        renderMath();
    }

    function nextTask() {
        currentIndex++;
        showTask();
    }

    loadCategories();
</script>

</body>
</html>
